# 「托管数据库 + 一台机器跑服务」版本的 compose（免费方案 F2 用）。
#
# 与根目录 docker-compose.yml 的区别：不启动自带 postgres / redis / backup，
# 直接用外部（托管）数据库，适合：
#   - 数据库用 Supabase / Neon / 云厂商托管 PG（有免费额度）；
#   - 机器只跑 api + worker + web + nginx。
#
# 用法（仓库根目录）：
#   DATABASE_URL='postgresql://user:pwd@host:5432/db?sslmode=require' JWT_SECRET='<随机串>' WEB_PORT=8080 docker compose -f deploy/compose.managed-db.yml up -d --build
#
# 不配 REDIS_URL 时用进程内调度器（单实例没问题）；要走 Redis 就补 REDIS_URL。

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?请先设置 DATABASE_URL（托管库连接串）}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:?请先设置 JWT_SECRET（随机串）}
      USE_PG_MEM: 'false'
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health | grep -q "status"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '30'
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/db/seed.js && node dist/main.js']
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      WORKER_ONLY: 'true'
      DATABASE_URL: ${DATABASE_URL:?请先设置 DATABASE_URL（托管库连接串）}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:?请先设置 JWT_SECRET（随机串）}
      USE_PG_MEM: 'false'
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '30'
    command: ['node', 'dist/main.js']
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '30'
    restart: unless-stopped

volumes:
  uploads:
