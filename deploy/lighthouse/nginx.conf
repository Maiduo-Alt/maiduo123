# 轻量服务器优化版 nginx 配置（对比 deploy/nginx.conf 的改动）：
#   1. 开启 gzip：前端主包约 1.4MB（Ant Design 全量），压缩后约 400KB，首屏加载快 2~3 倍；
#   2. /assets/ 是 Vite 带 hash 的静态文件 → 30 天 immutable 强缓存，之后每次部署只下载变化的 chunk；
#   3. /realtime/（Socket.IO）关闭 proxy_buffering、超时拉到 1 小时，避免长连接被默认 60s 切断；
#   4. /api/ 加大读写超时，兼容 Excel 批量导入等长请求。

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1k;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/xml
    application/javascript
    application/x-javascript
    image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /realtime/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # WebSocket 长连接：关缓冲、拉长超时，防止训练中途掉线重连
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # 上传的图片（商品主图/详情图、内容配图）由后端静态提供
  location /uploads/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Vite 产物带内容 hash，可放心长缓存
  location /assets/ {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
    # index.html 不缓存，保证发新版后刷新就能拿到新入口
    add_header Cache-Control "no-cache";
  }
}
