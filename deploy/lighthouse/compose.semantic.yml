# 轻量服务器专用语义服务叠加层（配合 deploy/lighthouse/docker-compose.yml 使用）
# 用法：docker compose -f deploy/lighthouse/docker-compose.yml -f deploy/lighthouse/compose.semantic.yml --env-file .env --profile semantic up -d --build
# 与 deploy/compose.semantic.yml 的区别：轻量栈没有 worker 服务（进程内调度器），只给 api 注入环境变量。
services:
  semantic-api:
    profiles: [semantic]
    build:
      context: ../../backend/semantic-api
      dockerfile: Dockerfile
    environment:
      SEMANTIC_MODEL_NAME: ${SEMANTIC_MODEL_NAME:-BAAI/bge-small-zh-v1.5}
      SEMANTIC_MODEL_CACHE: /models
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - semantic-model-cache:/models
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  api:
    environment:
      SEMANTIC_API_URL: http://semantic-api:8000
      SEMANTIC_MATCH_THRESHOLD: ${SEMANTIC_MATCH_THRESHOLD:-0.78}

volumes:
  semantic-model-cache:
