# Add after compose.semantic.yml to enable local-only answer judgments.
services:
  semantic-judge:
    profiles: [semantic]
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: 1024
    volumes:
      - semantic-judge-models:/root/.ollama
    restart: unless-stopped
  api:
    environment:
      REPLY_JUDGMENT_MODE: local
      LOCAL_SEMANTIC_JUDGE_URL: http://semantic-judge:11434/api/chat
      LOCAL_SEMANTIC_JUDGE_MODEL: ${LOCAL_SEMANTIC_JUDGE_MODEL:-qwen3:0.6b}
volumes:
  semantic-judge-models:
