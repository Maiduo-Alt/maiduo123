# Add after compose.semantic.yml to enable local-only answer judgments.
services:
  semantic-judge:
    profiles: [semantic]
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_CONTEXT_LENGTH: 4096
    volumes:
      - semantic-judge-models:/root/.ollama
    restart: unless-stopped
  api:
    environment:
      REPLY_JUDGMENT_MODE: local
      LOCAL_SEMANTIC_JUDGE_URL: http://semantic-judge:11434/v1/chat/completions
      LOCAL_SEMANTIC_JUDGE_MODEL: ${LOCAL_SEMANTIC_JUDGE_MODEL:-qwen2.5:1.5b}
volumes:
  semantic-judge-models:
