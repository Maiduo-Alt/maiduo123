name: Deploy to Tencent Lighthouse

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lighthouse
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull & Release on Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validate deployment secrets
        env:
          LIGHTHOUSE_HOST: ${{ secrets.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_SSH_KEY: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
        run: |
          if [ -z "$LIGHTHOUSE_HOST" ] || [ -z "$LIGHTHOUSE_SSH_KEY" ]; then
            echo "::error::缺少必要的 GitHub Secrets：请在仓库 Settings -> Secrets and variables -> Actions 中配置 LIGHTHOUSE_HOST 和 LIGHTHOUSE_SSH_KEY。"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH key
        env:
          LIGHTHOUSE_SSH_KEY: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LIGHTHOUSE_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy latest main to Tencent Lighthouse
        env:
          LIGHTHOUSE_HOST: ${{ secrets.LIGHTHOUSE_HOST }}
          LIGHTHOUSE_USER: ${{ secrets.LIGHTHOUSE_USER }}
          LIGHTHOUSE_PORT: ${{ secrets.LIGHTHOUSE_PORT }}
          LIGHTHOUSE_APP_DIR: ${{ secrets.LIGHTHOUSE_APP_DIR }}
        run: |
          USER="${LIGHTHOUSE_USER:-root}"
          PORT="${LIGHTHOUSE_PORT:-22}"
          APP_DIR="${LIGHTHOUSE_APP_DIR:-/home/ubuntu/cs-training}"
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=40"

          echo "==> 在 Runner 本地打包 main 分支 git bundle..."
          git bundle create /tmp/cs-training-main.bundle HEAD

          echo "==> 通过 SSH 上传代码包到腾讯云轻量服务器..."
          scp -P "$PORT" $SSH_OPTS /tmp/cs-training-main.bundle "${USER}@${LIGHTHOUSE_HOST}:/tmp/cs-training-main.bundle"
          rm -f /tmp/cs-training-main.bundle

          ssh -p "$PORT" $SSH_OPTS "${USER}@${LIGHTHOUSE_HOST}" \
            "APP_DIR='${APP_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail

          exec 9>/tmp/cs-training-deploy.lock
          if ! flock -n 9; then
            echo "已有另一个部署任务正在运行，请稍后重试。"
            exit 1
          fi

          cd "$APP_DIR"
          echo "==> 当前目录：$(pwd)"

          OWNER="$(stat -c '%U' "$APP_DIR")"
          chmod 644 /tmp/cs-training-main.bundle
          if [ "$(id -u)" -eq 0 ] && [ "$OWNER" != "root" ]; then
            echo "==> 以 $OWNER 身份从本地代码包更新 main..."
            sudo -u "$OWNER" git fetch /tmp/cs-training-main.bundle HEAD
            sudo -u "$OWNER" git checkout main
            sudo -u "$OWNER" git merge --ff-only FETCH_HEAD
          else
            echo "==> 从本地代码包更新 main..."
            git fetch /tmp/cs-training-main.bundle HEAD
            git checkout main
            git merge --ff-only FETCH_HEAD
          fi
          rm -f /tmp/cs-training-main.bundle

          echo "==> 当前版本：$(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"
          echo "==> 执行本地语义判定发布脚本（含构建、模型预检、数据库备份与健康检查）..."
          bash deploy/lighthouse/release-local-judge.sh
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/cs-training-main.bundle
