# 免费云部署的一种方案：Render（免费 Web Service）+ 托管 PostgreSQL（Supabase 免费版）
#
# 用法：把仓库推到 GitHub → Render 控制台 New → Blueprint → 选这个仓库（Render 会读 render.yaml）；
#      然后在控制台把 DATABASE_URL 填成托管库的连接串（见 deploy/FREE.md）。
#
# 说明：
# - Render 免费实例 15 分钟无访问会休眠，冷启动约 30 秒；512MB 内存，够这个系统跑（压测 P95 ~70ms）；
# - 免费实例的磁盘是**临时的**：上传的图片（UPLOAD_DIR）重启/重新部署后会丢，
#   长期用请把 UPLOAD_DIR 指到对象存储，或改用有持久卷的方案（见 deploy/FREE.md 的方案 F2/F3）；
# - 数据库不放 Render（免费 Postgres 有期限限制），走 Supabase 免费版，连接串在控制台填。

services:
  - type: web
    name: cs-training-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # 首次部署要把表结构和内容库灌进去，再启动 API（等价于 compose 里的 migrate → seed → main）
    dockerCommand: sh -c "node backend/dist/db/migrate.js && node backend/dist/db/seed.js && node backend/dist/main.js"
    healthCheckPath: /api/health
    envVars:
      - key: USE_PG_MEM
        value: 'false'
      - key: DATABASE_URL
        sync: false # 在 Render 控制台填托管库的连接串（含 sslmode=require）
      - key: JWT_SECRET
        generateValue: true # Render 自动生成随机密钥，别用仓库里的占位值
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: APP_VERSION
        value: render-free
