version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cs_training
      # 口令可用 .env 覆盖（deploy/env.production.example）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs_training_pwd}
      POSTGRES_DB: cs_training
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cs_training']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://cs_training:${POSTGRES_PASSWORD:-cs_training_pwd}@postgres:5432/cs_training
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      USE_PG_MEM: 'false'
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # 方案 5.10：健康检查接口 /api/health（供监控与容器编排判断存活）
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health | grep -q "\"status\":\"ok\""']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 方案 5.10：日志轮转（保留 30 份，避免容器日志把磁盘写满）
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '30'
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/db/seed.js && node dist/main.js']
    restart: unless-stopped

  # 方案 5.10：worker 复用 api 镜像，只跑延迟队列 / 超时检测 / 异步导入，不接 HTTP
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      WORKER_ONLY: 'true'
      DATABASE_URL: postgres://cs_training:${POSTGRES_PASSWORD:-cs_training_pwd}@postgres:5432/cs_training
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      USE_PG_MEM: 'false'
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '30'
    command: ['node', 'dist/main.js']
    restart: unless-stopped

  # 每日自动备份（方案 5.10：pg_dump + 保留 30 天）
  backup:
    image: postgres:15-alpine
    environment:
      DATABASE_URL: postgres://cs_training:${POSTGRES_PASSWORD:-cs_training_pwd}@postgres:5432/cs_training
      BACKUP_KEEP: '30'
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        set -e
        while true; do
          pg_dump --format=custom --no-owner --no-privileges \
            --file "/backups/cs_training_$(date +%Y%m%d-%H%M%S).dump" "$$DATABASE_URL"
          echo "[backup] $(date '+%Y-%m-%d %H:%M:%S') 备份完成，清理超出 $$BACKUP_KEEP 份的旧备份"
          ls -1t /backups/cs_training_*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '30'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # 对外端口可用 .env 的 WEB_PORT 覆盖（默认 8080）
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '30'
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
